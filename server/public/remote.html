<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Desktop - WebRTC</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #ffffff;
            overflow: hidden;
        }

        .remote-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .remote-header {
            background: rgba(30, 30, 30, 0.8);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
        }

        .remote-title-group {
            display: flex;
            flex-direction: column;
        }

        .remote-title {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 2px;
        }

        .remote-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .remote-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .ee-control-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .ee-control-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .ee-control-btn.active {
            background: rgba(66, 153, 225, 0.2);
            border-color: #4299e1;
            color: #4299e1;
        }

        .ee-control-btn.recording {
            background: rgba(245, 101, 101, 0.2);
            border-color: #f56565;
            color: #f56565;
            animation: pulse-red 2s infinite;
        }

        @keyframes pulse-red {
            0% {
                box-shadow: 0 0 0 0 rgba(245, 101, 101, 0.4);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(245, 101, 101, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(245, 101, 101, 0);
            }
        }

        .header-right {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 15px;
        }

        .close-btn {
            background: rgba(245, 101, 101, 0.1);
            border: 1px solid rgba(245, 101, 101, 0.2);
            color: #f56565;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .close-btn:hover {
            background: #f56565;
            color: white;
        }

        /* Modal Styles */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: #2d3748;
            border-radius: 16px;
            width: 350px;
            padding: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            transform: translateY(20px);
            transition: transform 0.3s;
        }

        .modal-overlay.active .modal {
            transform: translateY(0);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #fff;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            transition: background 0.2s;
        }

        .checkbox-group:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .checkbox-group input {
            width: 18px;
            height: 18px;
            accent-color: #4299e1;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .modal-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .btn-start {
            background: #4299e1;
            color: white;
        }

        .btn-start:hover {
            background: #3182ce;
        }

        #recordingTimer {
            font-family: monospace;
            color: #f56565;
            font-weight: 700;
            font-size: 14px;
            display: none;
        }

        .remote-screen {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        video {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            display: none;
            cursor: crosshair;
        }

        video.active {
            display: block;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.8);
            gap: 16px;
        }

        .loading-overlay.hidden {
            display: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            font-size: 14px;
            color: #888;
        }

        .error-message {
            color: #ef4444;
            font-size: 14px;
            text-align: center;
            max-width: 400px;
        }
    </style>
</head>

<body>
    <div class="remote-container">
        <div class="remote-header">
            <div class="remote-title-group">
                <div class="remote-title" id="remoteTitle">Remote Desktop - WebRTC</div>
                <div class="remote-status">
                    <div class="status-indicator connecting" id="statusIndicator"></div>
                    <span id="statusText">Connecting...</span>
                    <span id="recordingTimer"> | 00:00</span>
                </div>
            </div>

            <div class="remote-controls">
                <button class="ee-control-btn active" id="btnMouse" onclick="toggleMouseControl()"
                    title="Toggle Mouse Control">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 6v6a3 3 0 1 1-6 0V6a3 3 0 0 1 6 0z"></path>
                        <path d="M12 19V5"></path>
                    </svg>
                </button>

                <button class="ee-control-btn active" id="btnKeyboard" onclick="toggleKeyboardControl()"
                    title="Toggle Keyboard Control">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect>
                        <path d="M6 8h.01"></path>
                        <path d="M10 8h.01"></path>
                        <path d="M14 8h.01"></path>
                        <path d="M18 8h.01"></path>
                        <path d="M6 12h.01"></path>
                        <path d="M10 12h.01"></path>
                        <path d="M14 12h.01"></path>
                        <path d="M18 12h.01"></path>
                        <path d="M7 16h10"></path>
                    </svg>
                </button>

                <div style="width: 1px; height: 24px; background: rgba(255,255,255,0.1); margin: 0 5px;"></div>

                <button class="ee-control-btn" id="btnRecord" onclick="openRecordModal()" title="Record Screen">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>

            <div class="header-right">
                <button class="close-btn" onclick="closeRemote()">Close Session</button>
            </div>
        </div>

        <div class="remote-screen">
            <video id="remoteVideo" autoplay playsinline></video>
            <div class="loading-overlay" id="loadingOverlay">
                <div class="spinner"></div>
                <div class="loading-text" id="loadingText">Connecting to client...</div>
            </div>
        </div>
    </div>

    <!-- Recording Options Modal -->
    <div class="modal-overlay" id="recordModal">
        <div class="modal">
            <div class="modal-title">Recording Settings</div>

            <div class="form-group">
                <label class="checkbox-group">
                    <input type="checkbox" id="recSystemAudio" checked>
                    <div>
                        <div style="font-weight: 600; font-size: 14px;">Include System Audio</div>
                        <div style="font-size: 12px; color: #a0aec0;">Capture sounds from the remote client</div>
                    </div>
                </label>
            </div>

            <div class="form-group">
                <label class="checkbox-group">
                    <input type="checkbox" id="recClientMic">
                    <div>
                        <div style="font-weight: 600; font-size: 14px;">Include Client Microphone</div>
                        <div style="font-size: 12px; color: #a0aec0;">Record audio from the remote microphone</div>
                    </div>
                </label>
            </div>

            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeRecordModal()">Cancel</button>
                <button class="btn-start" onclick="startRecording()">Start Recording</button>
            </div>
        </div>
    </div>

    <script>
        // Get client info from URL
        const urlParams = new URLSearchParams(window.location.search);
        const clientId = urlParams.get('clientId');
        const hostname = urlParams.get('hostname') || 'Unknown';

        if (!clientId) {
            alert('No client ID specified');
            window.close();
        }

        // Setup
        const socket = io();
        const video = document.getElementById('remoteVideo');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');
        const statusIndicator = document.getElementById('statusIndicator');
        const statusText = document.getElementById('statusText');
        const remoteTitle = document.getElementById('remoteTitle');

        remoteTitle.textContent = `Remote Desktop - ${hostname}`;

        let peerConnection = null;
        let dataChannel = null;
        let isConnected = false;

        // Control states
        let mouseEnabled = true;
        let keyboardEnabled = true;

        // Recording states
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let recordingStartTime = 0;
        let recordingInterval = null;

        // WebRTC Configuration
        const config = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        // Socket.io events
        socket.on('connect', () => {
            console.log('[Remote] Connected to server');
            updateStatus('connecting', 'Starting remote session...');

            // Start remote desktop
            socket.emit('admin:start-remote-desktop', clientId);
        });

        socket.on('disconnect', () => {
            console.log('[Remote] Disconnected from server');
            updateStatus('disconnected', 'Disconnected');
            showLoading('Connection lost', true);
            cleanup();
        });

        socket.on('admin:remote-desktop-started', (data) => {
            console.log('[Remote] Remote desktop started:', data);
            updateStatus('connecting', 'Waiting for peer...');
            loadingText.textContent = 'Waiting for client connection...';
        });

        socket.on('admin:remote-desktop-error', (data) => {
            console.error('[Remote] Error:', data.message);
            showLoading(data.message, true);
            updateStatus('disconnected', 'Error');
        });

        socket.on('admin:remote-desktop-disconnected', (data) => {
            console.log('[Remote] Client disconnected:', data.message);
            showLoading('Client disconnected', true);
            updateStatus('disconnected', 'Client disconnected');
            cleanup();
        });

        // WebRTC signaling
        socket.on('admin:webrtc-signal', async (data) => {
            console.log('[WebRTC] Received signal:', data.signal.type);

            if (!peerConnection) {
                createPeerConnection();
            }

            const signal = data.signal;

            if (signal.type === 'offer') {
                // Client sent offer, create answer
                await peerConnection.setRemoteDescription(new RTCSessionDescription(signal.offer));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);

                // Send answer back to client
                socket.emit('admin:webrtc-signal', {
                    clientId: clientId,
                    signal: {
                        type: 'answer',
                        answer: answer
                    }
                });
            } else if (signal.type === 'candidate' && signal.candidate) {
                // Add ICE candidate
                await peerConnection.addIceCandidate(new RTCIceCandidate(signal.candidate));
            }
        });

        // Create WebRTC PeerConnection
        function createPeerConnection() {
            console.log('[WebRTC] Creating peer connection');
            peerConnection = new RTCPeerConnection(config);

            // ICE candidate event
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    console.log('[WebRTC] Sending ICE candidate');
                    socket.emit('admin:webrtc-signal', {
                        clientId: clientId,
                        signal: {
                            type: 'candidate',
                            candidate: event.candidate
                        }
                    });
                }
            };

            // Track event - receive video stream
            peerConnection.ontrack = (event) => {
                console.log('[WebRTC] Received track:', event.track.kind);
                if (event.track.kind === 'video') {
                    video.srcObject = event.streams[0];
                    video.classList.add('active');
                    hideLoading();
                    updateStatus('connected', 'Connected');
                    isConnected = true;
                }
            };

            // Connection state changes
            peerConnection.onconnectionstatechange = () => {
                const state = peerConnection.connectionState;
                console.log('[WebRTC] Connection state:', state);

                if (state === 'connected') {
                    updateStatus('connected', 'Connected');
                } else if (state === 'disconnected' || state === 'failed' || state === 'closed') {
                    updateStatus('disconnected', 'Disconnected');
                    showLoading('Connection lost', true);
                    cleanup();
                }
            };

            // Receive data channel from client (client creates it with the offer)
            peerConnection.ondatachannel = (event) => {
                console.log('[WebRTC] Data channel received:', event.channel.label);
                dataChannel = event.channel;

                dataChannel.onopen = () => {
                    console.log('[WebRTC] ✓✓✓ Data channel OPENED - ready to send input');
                };

                dataChannel.onclose = () => {
                    console.log('[WebRTC] Data channel CLOSED');
                };

                dataChannel.onerror = (error) => {
                    console.error('[WebRTC] Data channel ERROR:', error);
                };
            };
        }

        // Input handling with throttling and drag support
        let lastMouseMove = 0;
        const MOUSE_THROTTLE = 16; // ~60fps
        let mouseButtonPressed = null; // Track which button is currently pressed (for drag)
        let lastMouseDownTime = 0;
        const CLICK_THRESHOLD = 200; // ms - if mouseup within this time, it's a click, not a drag

        video.addEventListener('mousemove', (e) => {
            if (!isConnected || !dataChannel || dataChannel.readyState !== 'open' || !mouseEnabled) return;

            const now = Date.now();
            if (now - lastMouseMove < MOUSE_THROTTLE) return;
            lastMouseMove = now;

            const rect = video.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            const y = (e.clientY - rect.top) / rect.height;

            // Only send if within bounds
            if (x >= 0 && x <= 1 && y >= 0 && y <= 1) {
                // If a button is pressed, this is a DRAG operation
                if (mouseButtonPressed !== null) {
                    dataChannel.send(JSON.stringify({
                        type: 'mousedrag',
                        x: x,
                        y: y,
                        button: mouseButtonPressed
                    }));
                } else {
                    // Normal mouse move (no button pressed)
                    dataChannel.send(JSON.stringify({
                        type: 'mousemove',
                        x: x,
                        y: y
                    }));
                }
            }
        });

        video.addEventListener('mousedown', (e) => {
            if (!isConnected || !dataChannel || dataChannel.readyState !== 'open' || !mouseEnabled) return;
            e.preventDefault();

            const rect = video.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            const y = (e.clientY - rect.top) / rect.height;

            if (x >= 0 && x <= 1 && y >= 0 && y <= 1) {
                const button = e.button === 2 ? 'right' : (e.button === 1 ? 'middle' : 'left');
                mouseButtonPressed = button;
                lastMouseDownTime = Date.now();

                const msg = {
                    type: 'mousedown',
                    x: x,
                    y: y,
                    button: button
                };
                console.log('[Remote] >>>> Sending MOUSEDOWN:', msg.button, 'at', msg.x.toFixed(2), msg.y.toFixed(2));
                dataChannel.send(JSON.stringify(msg));
            }
        });

        video.addEventListener('mouseup', (e) => {
            if (!isConnected || !dataChannel || dataChannel.readyState !== 'open' || !mouseEnabled) return;
            e.preventDefault();

            const rect = video.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            const y = (e.clientY - rect.top) / rect.height;

            if (x >= 0 && x <= 1 && y >= 0 && y <= 1) {
                const button = e.button === 2 ? 'right' : (e.button === 1 ? 'middle' : 'left');
                const timeSinceDown = Date.now() - lastMouseDownTime;

                // If released quickly, it's a CLICK. Otherwise it was a DRAG (already sent during mousemove)
                if (timeSinceDown < CLICK_THRESHOLD) {
                    const msg = {
                        type: 'click',
                        x: x,
                        y: y,
                        button: button
                    };
                    console.log('[Remote] >>>> Sending CLICK:', msg.button, 'at', msg.x.toFixed(2), msg.y.toFixed(2));
                    dataChannel.send(JSON.stringify(msg));
                }

                // Always send mouseup to release the button on remote
                const upMsg = {
                    type: 'mouseup',
                    x: x,
                    y: y,
                    button: button
                };
                console.log('[Remote] >>>> Sending MOUSEUP:', upMsg.button);
                dataChannel.send(JSON.stringify(upMsg));

                mouseButtonPressed = null; // Release button
            }
        });

        video.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        video.addEventListener('dblclick', (e) => {
            if (!isConnected || !dataChannel || dataChannel.readyState !== 'open' || !mouseEnabled) return;
            e.preventDefault();

            const rect = video.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            const y = (e.clientY - rect.top) / rect.height;

            if (x >= 0 && x <= 1 && y >= 0 && y <= 1) {
                console.log('[Remote] >>>> Sending DOUBLE CLICK at', x.toFixed(2), y.toFixed(2));
                dataChannel.send(JSON.stringify({
                    type: 'doubleclick',
                    x: x,
                    y: y
                }));
            }
        });

        // Keyboard handling - focus on video area
        video.setAttribute('tabindex', '0');
        video.addEventListener('click', () => {
            video.focus();
        });

        document.addEventListener('keydown', (e) => {
            if (!isConnected || !dataChannel || dataChannel.readyState !== 'open' || !keyboardEnabled) return;

            // Don't capture browser shortcuts
            if (e.ctrlKey && (e.key === 'w' || e.key === 't' || e.key === 'r')) return;

            // IGNORE modifier keys when pressed alone (they should only work as modifiers)
            const modifierKeys = ['Shift', 'Control', 'Alt', 'Meta', 'CapsLock', 'NumLock', 'ScrollLock'];
            if (modifierKeys.includes(e.key)) {
                return; // Don't send modifier keys by themselves
            }

            e.preventDefault();

            const msg = {
                type: 'keypress',
                key: e.key,
                ctrl: e.ctrlKey,
                shift: e.shiftKey,
                alt: e.altKey,
                meta: e.metaKey
            };
            console.log('[Remote] >>>> Sending KEY:', msg.key, msg);
            dataChannel.send(JSON.stringify(msg));
        });

        // UI helpers
        function updateStatus(state, text) {
            statusIndicator.className = `status-indicator ${state}`;
            statusText.textContent = text;
        }

        function showLoading(text, isError = false) {
            loadingText.textContent = text;
            if (isError) {
                loadingText.classList.add('error-message');
            } else {
                loadingText.classList.remove('error-message');
            }
            loadingOverlay.classList.remove('hidden');
        }

        function hideLoading() {
            loadingOverlay.classList.add('hidden');
        }

        function cleanup() {
            if (dataChannel) {
                dataChannel.close();
                dataChannel = null;
            }

            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }

            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }

            video.classList.remove('active');
            isConnected = false;
            if (isRecording) stopRecording();
        }

        // --- Recording Logic ---
        function openRecordModal() {
            if (isRecording) {
                stopRecording();
                return;
            }
            document.getElementById('recordModal').classList.add('active');
        }

        function closeRecordModal() {
            document.getElementById('recordModal').classList.remove('active');
        }

        async function startRecording() {
            closeRecordModal();
            recordedChunks = [];

            try {
                const stream = video.srcObject;
                if (!stream) throw new Error('No stream available');

                // Get options
                const includeSystemAudio = document.getElementById('recSystemAudio').checked;
                const includeClientMic = document.getElementById('recClientMic').checked;

                const recordingStream = new MediaStream();

                // Always add video
                stream.getVideoTracks().forEach(track => recordingStream.addTrack(track));

                // Add audio tracks
                // webrtc-capture.html adds system audio first, then mic.
                const audioTracks = stream.getAudioTracks();

                if (includeSystemAudio && audioTracks.length > 0) {
                    recordingStream.addTrack(audioTracks[0]);
                    console.log('[Recording] Added System Audio track');
                }
                if (includeClientMic && audioTracks.length > 1) {
                    recordingStream.addTrack(audioTracks[1]);
                    console.log('[Recording] Added Client Mic track');
                } else if (includeClientMic && audioTracks.length === 1 && !includeSystemAudio) {
                    // Fallback if only one track exists but system audio wasn't requested
                    recordingStream.addTrack(audioTracks[0]);
                    console.log('[Recording] Added only available Audio track as Mic');
                }

                mediaRecorder = new MediaRecorder(recordingStream, {
                    mimeType: 'video/webm;codecs=vp9,opus'
                });

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };

                mediaRecorder.onstop = saveRecording;

                mediaRecorder.start();
                isRecording = true;

                // UI Update
                const btnRecord = document.getElementById('btnRecord');
                btnRecord.classList.add('recording');
                btnRecord.title = 'Stop Recording';

                document.getElementById('recordingTimer').style.display = 'inline';
                recordingStartTime = Date.now();
                recordingInterval = setInterval(updateRecordingTimer, 1000);

            } catch (err) {
                console.error('Error starting recording:', err);
                alert('Recording failed: ' + err.message);
            }
        }

        function updateRecordingTimer() {
            const elapsed = Math.floor((Date.now() - recordingStartTime) / 1000);
            const m = Math.floor(elapsed / 60).toString().padStart(2, '0');
            const s = (elapsed % 60).toString().padStart(2, '0');
            document.getElementById('recordingTimer').textContent = ` | ${m}:${s}`;
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            isRecording = false;
            clearInterval(recordingInterval);

            const btnRecord = document.getElementById('btnRecord');
            btnRecord.classList.remove('recording');
            btnRecord.title = 'Record Screen';
            document.getElementById('recordingTimer').style.display = 'none';
        }

        async function saveRecording() {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const formData = new FormData();
            const fileName = `remote-${clientId}-${Date.now()}.webm`;
            formData.append('recording', blob, fileName);

            try {
                const res = await fetch('/api/recordings/upload', {
                    method: 'POST',
                    body: formData
                });
                if (res.ok) {
                    console.log('Recording uploaded successfully');
                } else {
                    throw new Error('Upload failed');
                }
            } catch (err) {
                console.error('Save recording error:', err);
                // Fallback to local download if upload fails
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                a.click();
            }
        }

        // --- Toggle functions (Refactored) ---
        function toggleMouseControl() {
            mouseEnabled = !mouseEnabled;
            const btn = document.getElementById('btnMouse');
            if (mouseEnabled) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
            console.log('[Remote] Mouse control:', mouseEnabled ? 'enabled' : 'disabled');
        }

        function toggleKeyboardControl() {
            keyboardEnabled = !keyboardEnabled;
            const btn = document.getElementById('btnKeyboard');
            if (keyboardEnabled) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
            console.log('[Remote] Keyboard control:', keyboardEnabled ? 'enabled' : 'disabled');
        }

        function closeRemote() {
            // Stop remote desktop
            socket.emit('admin:stop-remote-desktop', clientId);
            cleanup();
            window.close();
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            socket.emit('admin:stop-remote-desktop', clientId);
            cleanup();
        });
    </script>
</body>

</html>
