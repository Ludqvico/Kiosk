<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Control</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        .remote-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .remote-header {
            background: #1a1a1a;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .remote-title {
            font-size: 14px;
            font-weight: 500;
            color: #fff;
        }

        .remote-status {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            color: #888;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
        }

        .status-indicator.connected {
            background: #10b981;
        }

        .close-btn {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 6px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
        }

        .close-btn:hover {
            background: #dc2626;
        }

        .remote-screen {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            position: relative;
        }

        #remoteCanvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            cursor: crosshair;
            image-rendering: auto;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .loading-overlay.hidden {
            display: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 14px;
            color: #888;
        }

        .error-message {
            color: #ef4444;
            font-size: 14px;
            text-align: center;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <div class="remote-container">
        <div class="remote-header">
            <div class="remote-title" id="remoteTitle">Remote Control</div>
            <div class="remote-status">
                <div class="status-indicator" id="statusIndicator"></div>
                <span id="statusText">Connecting...</span>
            </div>
            <button class="close-btn" onclick="closeRemote()">Close</button>
        </div>
        <div class="remote-screen">
            <canvas id="remoteCanvas"></canvas>
            <div class="loading-overlay" id="loadingOverlay">
                <div class="spinner"></div>
                <div class="loading-text" id="loadingText">Connecting to client...</div>
            </div>
        </div>
    </div>

    <script>
        // Ottieni clientId da URL query params
        const urlParams = new URLSearchParams(window.location.search);
        const clientId = urlParams.get('clientId');
        const hostname = urlParams.get('hostname') || 'Unknown';

        if (!clientId) {
            alert('No client ID specified');
            window.close();
        }

        // Setup
        const socket = io();
        const canvas = document.getElementById('remoteCanvas');
        const ctx = canvas.getContext('2d');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');
        const statusIndicator = document.getElementById('statusIndicator');
        const statusText = document.getElementById('statusText');
        const remoteTitle = document.getElementById('remoteTitle');

        remoteTitle.textContent = `Remote Control - ${hostname}`;

        let isConnected = false;
        let screenWidth = 0;
        let screenHeight = 0;

        // Socket events
        socket.on('connect', () => {
            console.log('[Remote] Connected to server, socket.id:', socket.id);
            updateStatus('connecting', 'Starting remote session...');

            console.log('[Remote] Sending start-remote-control for clientId:', clientId);
            // Avvia remote control
            socket.emit('admin:start-remote-control', clientId);
        });

        socket.on('disconnect', () => {
            console.log('Disconnected from server');
            updateStatus('disconnected', 'Disconnected');
            showLoading('Connection lost', true);
        });

        socket.on('admin:remote-control-started', (data) => {
            console.log('Remote control started:', data);
            updateStatus('waiting', 'Waiting for screen...');
            loadingText.textContent = 'Waiting for screen data...';
        });

        socket.on('admin:screen-frame', (data) => {
            if (data.clientId !== clientId) return;

            if (!isConnected) {
                isConnected = true;
                hideLoading();
                updateStatus('connected', `Connected - ${data.width}x${data.height}`);
            }

            screenWidth = data.width;
            screenHeight = data.height;

            // Disegna frame SUBITO (non aspettare onload)
            const img = new Image();
            img.onload = () => {
                // Ridimensiona canvas SOLO se size cambia
                if (canvas.width !== data.width || canvas.height !== data.height) {
                    canvas.width = data.width;
                    canvas.height = data.height;
                }

                // Pulisci e disegna
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);
            };
            img.onerror = (err) => {
                console.error('[Remote] Error loading image:', err);
            };
            img.src = data.frame;

            // Aggiorna status
            statusText.textContent = `Connected - ${data.width}x${data.height}`;
        });

        socket.on('admin:remote-control-error', (data) => {
            console.error('Remote control error:', data);
            showLoading(data.message, true);
            updateStatus('error', 'Error');
        });

        // Input handlers
        function getNormalizedCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            const y = (e.clientY - rect.top) / rect.height;
            return { x, y };
        }

        // Throttle mousemove per non inviare troppi eventi
        let lastMouseMove = 0;
        canvas.addEventListener('mousemove', (e) => {
            if (!isConnected) return;

            const now = Date.now();
            if (now - lastMouseMove < 50) return; // Max 20 eventi/sec
            lastMouseMove = now;

            const coords = getNormalizedCoords(e);
            socket.emit('admin:remote-input', {
                clientId: clientId,
                type: 'mousemove',
                data: coords
            });
        });

        canvas.addEventListener('mousedown', (e) => {
            if (!isConnected) return;
            const coords = getNormalizedCoords(e);
            socket.emit('admin:remote-input', {
                clientId: clientId,
                type: 'mousedown',
                data: {
                    ...coords,
                    button: e.button === 2 ? 'right' : 'left'
                }
            });
        });

        canvas.addEventListener('mouseup', (e) => {
            if (!isConnected) return;
            const coords = getNormalizedCoords(e);
            socket.emit('admin:remote-input', {
                clientId: clientId,
                type: 'mouseup',
                data: {
                    ...coords,
                    button: e.button === 2 ? 'right' : 'left'
                }
            });
        });

        canvas.addEventListener('click', (e) => {
            if (!isConnected) return;
            const coords = getNormalizedCoords(e);
            socket.emit('admin:remote-input', {
                clientId: clientId,
                type: 'click',
                data: {
                    ...coords,
                    button: e.button === 2 ? 'right' : 'left'
                }
            });
        });

        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        document.addEventListener('keydown', (e) => {
            if (!isConnected) return;
            e.preventDefault();

            const modifiers = [];
            if (e.ctrlKey) modifiers.push('Control');
            if (e.altKey) modifiers.push('Alt');
            if (e.shiftKey) modifiers.push('Shift');
            if (e.metaKey) modifiers.push('Meta');

            socket.emit('admin:remote-input', {
                clientId: clientId,
                type: 'keydown',
                data: {
                    key: e.key,
                    modifiers: modifiers
                }
            });
        });

        document.addEventListener('keyup', (e) => {
            if (!isConnected) return;
            e.preventDefault();

            const modifiers = [];
            if (e.ctrlKey) modifiers.push('Control');
            if (e.altKey) modifiers.push('Alt');
            if (e.shiftKey) modifiers.push('Shift');
            if (e.metaKey) modifiers.push('Meta');

            socket.emit('admin:remote-input', {
                clientId: clientId,
                type: 'keyup',
                data: {
                    key: e.key,
                    modifiers: modifiers
                }
            });
        });

        // UI helpers
        function updateStatus(state, text) {
            statusText.textContent = text;
            statusIndicator.className = 'status-indicator';

            if (state === 'connected') {
                statusIndicator.classList.add('connected');
            }
        }

        function showLoading(text, isError = false) {
            loadingOverlay.classList.remove('hidden');
            loadingText.textContent = text;
            if (isError) {
                loadingText.className = 'error-message';
            } else {
                loadingText.className = 'loading-text';
            }
        }

        function hideLoading() {
            loadingOverlay.classList.add('hidden');
        }

        function closeRemote() {
            console.log('[Remote] Closing remote control...');
            // Ferma remote control
            socket.emit('admin:stop-remote-control', clientId);
            socket.disconnect();

            // Chiudi finestra
            window.close();
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            console.log('[Remote] Page unload - stopping remote control');
            socket.emit('admin:stop-remote-control', clientId);
        });
    </script>
</body>
</html>
