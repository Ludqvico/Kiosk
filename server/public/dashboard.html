<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosk Management</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-bg: #fafafa;
            --color-surface: #ffffff;
            --color-border: #e5e5e5;
            --color-text-primary: #171717;
            --color-text-secondary: #737373;
            --color-text-tertiary: #a3a3a3;
            --color-accent: #0ea5e9;
            --color-success: #22c55e;
            --color-danger: #ef4444;
            --color-warning: #f59e0b;
            --sidebar-width: 240px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
            background: var(--color-bg);
            color: var(--color-text-primary);
            line-height: 1.5;
        }

        /* Layout */
        .app-container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--color-surface);
            border-right: 1px solid var(--color-border);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        .logo {
            font-size: 18px;
            font-weight: 600;
            color: var(--color-text-primary);
            padding: 0 12px;
        }

        .nav-section {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .nav-item {
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 14px;
            color: var(--color-text-secondary);
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-item:hover {
            background: var(--color-bg);
            color: var(--color-text-primary);
        }

        .nav-item.active {
            background: var(--color-bg);
            color: var(--color-text-primary);
            font-weight: 500;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 32px 40px;
            overflow-y: auto;
        }

        /* Header */
        .page-header {
            margin-bottom: 32px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--color-text-primary);
            margin-bottom: 8px;
        }

        .page-subtitle {
            font-size: 14px;
            color: var(--color-text-secondary);
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 16px 20px;
            flex: 1;
            min-width: 0;
        }

        .stat-label {
            font-size: 13px;
            color: var(--color-text-secondary);
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 600;
            color: var(--color-text-primary);
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        button {
            padding: 10px 16px;
            border: 1px solid var(--color-border);
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            background: var(--color-surface);
            color: var(--color-text-primary);
        }

        button:hover {
            background: var(--color-bg);
        }

        button.primary {
            background: var(--color-text-primary);
            color: white;
            border-color: var(--color-text-primary);
        }

        button.primary:hover {
            background: #404040;
        }

        button.danger {
            background: var(--color-danger);
            color: white;
            border-color: var(--color-danger);
        }

        button.danger:hover {
            background: #dc2626;
        }

        button.success {
            background: var(--color-success);
            color: white;
            border-color: var(--color-success);
        }

        button.success:hover {
            background: #16a34a;
        }

        /* Clients Grid */
        .clients-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }

        .client-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 20px;
            transition: all 0.15s;
        }

        .client-card:hover {
            border-color: var(--color-text-tertiary);
        }

        .client-card.locked {
            border-left: 3px solid var(--color-danger);
        }

        .client-card.unlocked {
            border-left: 3px solid var(--color-success);
        }

        .client-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .client-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--color-text-primary);
        }

        .client-status {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        .client-status.locked {
            background: #fee2e2;
            color: var(--color-danger);
        }

        .client-status.unlocked {
            background: #dcfce7;
            color: var(--color-success);
        }

        .client-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
        }

        .info-label {
            color: var(--color-text-secondary);
        }

        .info-value {
            color: var(--color-text-primary);
            font-weight: 500;
        }

        .platform-badge {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
        }

        .platform-badge.darwin {
            background: #e0f2fe;
            color: #0369a1;
        }

        .platform-badge.win32 {
            background: #fef3c7;
            color: #b45309;
        }

        .client-actions {
            display: flex;
            gap: 8px;
        }

        .client-actions button {
            flex: 1;
            padding: 8px 12px;
            font-size: 13px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            grid-column: 1 / -1;
        }

        .empty-state-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--color-text-primary);
            margin-bottom: 8px;
        }

        .empty-state-text {
            font-size: 14px;
            color: var(--color-text-secondary);
        }

        /* Connection Status */
        .connection-status {
            position: fixed;
            top: 16px;
            right: 16px;
            padding: 8px 14px;
            border-radius: 6px;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 1000;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--color-success);
        }

        .status-indicator.disconnected {
            background: var(--color-danger);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">Kiosk Manager</div>

            <nav class="nav-section">
                <div class="nav-item active">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect x="2" y="3" width="12" height="10" rx="1"/>
                        <line x1="2" y1="6" x2="14" y2="6"/>
                    </svg>
                    Active Stations
                </div>
                <div class="nav-item">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                        <circle cx="8" cy="8" r="6"/>
                        <path d="M8 4v4l2 2"/>
                    </svg>
                    Activity Log
                </div>
                <div class="nav-item">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M8 2v12M2 8h12"/>
                    </svg>
                    Settings
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="connection-status" id="connectionStatus">
                <span class="status-indicator disconnected"></span>
                <span>Connecting...</span>
            </div>

            <div class="page-header">
                <h1 class="page-title">Active Stations</h1>
                <p class="page-subtitle">Manage and monitor all kiosk stations</p>
            </div>

            <div class="stats-bar">
                <div class="stat-card">
                    <div class="stat-label">Total Stations</div>
                    <div class="stat-value" id="totalCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Locked</div>
                    <div class="stat-value" id="lockedCount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Active</div>
                    <div class="stat-value" id="activeCount">0</div>
                </div>
            </div>

            <div class="controls">
                <button class="danger" onclick="lockAll()">Lock All Stations</button>
                <button class="success" onclick="unlockAll()">Unlock All Stations</button>
                <button onclick="location.reload()">Refresh</button>
            </div>

            <div id="clientsContainer" class="clients-grid">
                <div class="empty-state">
                    <div class="empty-state-title">No stations connected</div>
                    <div class="empty-state-text">Stations will appear here when they connect to the server</div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const socket = io();
        const clients = new Map();

        socket.on('connect', () => {
            updateConnectionStatus(true);
        });

        socket.on('disconnect', () => {
            updateConnectionStatus(false);
        });

        socket.on('admin:client-connected', (client) => {
            clients.set(client.id, client);
            renderClients();
        });

        socket.on('admin:client-disconnected', ({ clientId }) => {
            clients.delete(clientId);
            renderClients();
        });

        socket.on('admin:client-status', ({ clientId, locked }) => {
            const client = clients.get(clientId);
            if (client) {
                client.locked = locked;
                renderClients();
            }
        });

        function lockClient(clientId) {
            socket.emit('admin:lock-client', clientId);
        }

        function unlockClient(clientId) {
            socket.emit('admin:unlock-client', clientId);
        }

        function lockAll() {
            if (confirm('Lock all stations?')) {
                socket.emit('admin:lock-all');
            }
        }

        function unlockAll() {
            if (confirm('Unlock all stations?')) {
                socket.emit('admin:unlock-all');
            }
        }

        function renderClients() {
            const container = document.getElementById('clientsContainer');
            const clientArray = Array.from(clients.values());

            if (clientArray.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-title">No stations connected</div>
                        <div class="empty-state-text">Stations will appear here when they connect to the server</div>
                    </div>
                `;
            } else {
                container.innerHTML = clientArray.map(client => `
                    <div class="client-card ${client.locked ? 'locked' : 'unlocked'}">
                        <div class="client-header">
                            <div class="client-name">${client.hostname}</div>
                            <div class="client-status ${client.locked ? 'locked' : 'unlocked'}">
                                ${client.locked ? 'Locked' : 'Active'}
                            </div>
                        </div>
                        <div class="client-info">
                            <div class="info-row">
                                <span class="info-label">Platform</span>
                                <span class="platform-badge ${client.platform}">${client.platform}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">ID</span>
                                <span class="info-value">${client.id.substring(0, 8)}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Connected</span>
                                <span class="info-value">${formatTime(client.connectedAt)}</span>
                            </div>
                        </div>
                        <div class="client-actions">
                            <button class="danger" onclick="lockClient('${client.id}')">Lock</button>
                            <button class="success" onclick="unlockClient('${client.id}')">Unlock</button>
                        </div>
                    </div>
                `).join('');
            }

            updateStats(clientArray);
        }

        function updateStats(clientArray) {
            const lockedCount = clientArray.filter(c => c.locked).length;
            const activeCount = clientArray.filter(c => !c.locked).length;

            document.getElementById('totalCount').textContent = clientArray.length;
            document.getElementById('lockedCount').textContent = lockedCount;
            document.getElementById('activeCount').textContent = activeCount;
        }

        function updateConnectionStatus(connected) {
            const statusEl = document.getElementById('connectionStatus');
            const indicator = statusEl.querySelector('.status-indicator');
            const text = statusEl.querySelector('span:last-child');

            if (connected) {
                indicator.classList.remove('disconnected');
                text.textContent = 'Connected';
            } else {
                indicator.classList.add('disconnected');
                text.textContent = 'Disconnected';
            }
        }

        function formatTime(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diff = Math.floor((now - date) / 1000);

            if (diff < 60) return `${diff}s ago`;
            if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
            if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
            return date.toLocaleDateString();
        }

        // Load initial clients
        fetch('/api/clients')
            .then(res => res.json())
            .then(data => {
                data.forEach(client => {
                    clients.set(client.id, client);
                });
                renderClients();
            })
            .catch(err => console.error('Error loading clients:', err));
    </script>
</body>
</html>
