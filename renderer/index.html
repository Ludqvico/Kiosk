<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosk Mode</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-color: white;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            cursor: none !important;
        }

        * {
            cursor: none !important;
        }

        /* Contenitore principale - facilmente modificabile */
        #content-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: white; /* Modifica questo colore o sostituisci con il tuo contenuto */
        }

        /* Opzionale: testo di debug (rimuovi in produzione) */
        .debug-info {
            position: fixed;
            bottom: 10px;
            right: 10px;
            font-family: monospace;
            font-size: 10px;
            color: #ccc;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div id="content-container">
        <!--
            Contenuto della lezione va qui.
            Per ora è solo uno sfondo bianco.
            Puoi sostituire questo div con:
            - iframe per contenuti web
            - video player
            - presentazioni
            - ecc.
        -->
    </div>

    <!-- Debug info (opzionale, rimuovi in produzione) -->
    <div class="debug-info">
        Kiosk Mode Active | Digita password per uscire
    </div>

    <script>
        // Previeni drag & drop
        document.addEventListener('dragover', e => e.preventDefault());
        document.addEventListener('drop', e => e.preventDefault());

        // Previeni selezione testo
        document.addEventListener('selectstart', e => e.preventDefault());
    </script>
</body>
</html>
