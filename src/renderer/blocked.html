<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locked</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        #lockMediaContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
        }

        #lockMediaContainer img,
        #lockMediaContainer video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .default-message {
            font-size: 48px;
            color: #333;
            text-align: center;
            padding: 40px;
        }
    </style>
</head>

<body>
    <div id="lockMediaContainer">
        <div class="default-message">🔒 Locked</div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        // Listen for custom lock screen media
        ipcRenderer.on('lock-screen-media', (event, customMedia) => {
            console.log('[Blocked] Received custom media:', customMedia);

            const container = document.getElementById('lockMediaContainer');

            if (customMedia && customMedia.data) {
                const { type, data } = customMedia;

                try {
                    if (type.startsWith('image/')) {
                        // Display image
                        const img = document.createElement('img');
                        img.src = data;
                        img.alt = 'Lock Screen';
                        img.onerror = () => {
                            console.error('[Blocked] Error loading image');
                            showDefaultScreen();
                        };
                        container.innerHTML = '';
                        container.appendChild(img);
                        console.log('[Blocked] Image displayed');
                    } else if (type.startsWith('video/')) {
                        // Display video with autoplay and loop
                        const video = document.createElement('video');
                        video.src = data;
                        video.autoplay = true;
                        video.loop = true;
                        video.muted = true;
                        video.controls = false;
                        video.onerror = () => {
                            console.error('[Blocked] Error loading video');
                            showDefaultScreen();
                        };
                        container.innerHTML = '';
                        container.appendChild(video);
                        console.log('[Blocked] Video displayed');
                    } else {
                        console.warn('[Blocked] Unsupported media type:', type);
                        showDefaultScreen();
                    }
                } catch (error) {
                    console.error('[Blocked] Error displaying media:', error);
                    showDefaultScreen();
                }
            } else {
                console.log('[Blocked] No custom media, using default');
                showDefaultScreen();
            }
        });

        function showDefaultScreen() {
            const container = document.getElementById('lockMediaContainer');
            container.innerHTML = '<div class="default-message">🔒 Locked</div>';
        }

        console.log('[Blocked] Lock screen ready, waiting for media...');
    </script>
</body>

</html>
