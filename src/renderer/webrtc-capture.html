<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>WebRTC Capture</title>
</head>
<body>
    <script>
        const { ipcRenderer } = require('electron');

        let peerConnection = null;
        let dataChannel = null;
        let mediaStream = null;

        // WebRTC Configuration
        const config = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        // Start WebRTC capture
        ipcRenderer.on('webrtc:start', async (event, sourceId) => {
            console.log('[WebRTC Renderer] Starting with sourceId:', sourceId);

            try {
                // Get screen stream using desktopCapturer sourceId
                const constraints = {
                    audio: false,
                    video: {
                        mandatory: {
                            chromeMediaSource: 'desktop',
                            chromeMediaSourceId: sourceId,
                            minWidth: 1280,
                            maxWidth: 1920,
                            minHeight: 720,
                            maxHeight: 1080,
                            minFrameRate: 15,
                            maxFrameRate: 30
                        }
                    }
                };

                mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
                console.log('[WebRTC Renderer] Screen captured');

                // Create PeerConnection
                peerConnection = new RTCPeerConnection(config);

                // ICE candidate event
                peerConnection.onicecandidate = (event) => {
                    if (event.candidate) {
                        // Serialize candidate to plain object
                        ipcRenderer.send('webrtc:icecandidate', {
                            candidate: event.candidate.candidate,
                            sdpMLineIndex: event.candidate.sdpMLineIndex,
                            sdpMid: event.candidate.sdpMid
                        });
                    }
                };

                // Connection state
                peerConnection.onconnectionstatechange = () => {
                    console.log('[WebRTC Renderer] Connection state:', peerConnection.connectionState);
                    ipcRenderer.send('webrtc:connectionstate', peerConnection.connectionState);
                };

                // Data channel for input
                peerConnection.ondatachannel = (event) => {
                    console.log('[WebRTC Renderer] Data channel received:', event.channel.label);
                    dataChannel = event.channel;

                    dataChannel.onopen = () => {
                        console.log('[WebRTC Renderer] Data channel OPENED - ready to receive input');
                    };

                    dataChannel.onclose = () => {
                        console.log('[WebRTC Renderer] Data channel CLOSED');
                    };

                    dataChannel.onerror = (error) => {
                        console.error('[WebRTC Renderer] Data channel ERROR:', error);
                    };

                    dataChannel.onmessage = (event) => {
                        console.log('[WebRTC Renderer] Received input data:', event.data);
                        const message = JSON.parse(event.data);
                        console.log('[WebRTC Renderer] Parsed input:', message.type, message);
                        ipcRenderer.send('webrtc:input', message);
                    };
                };

                // Add video track
                mediaStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, mediaStream);
                });

                // Create offer
                const offer = await peerConnection.createOffer({
                    offerToReceiveVideo: false,
                    offerToReceiveAudio: false
                });

                await peerConnection.setLocalDescription(offer);

                // Send offer to main process (serialize to plain object)
                ipcRenderer.send('webrtc:offer', {
                    type: offer.type,
                    sdp: offer.sdp
                });

                console.log('[WebRTC Renderer] Offer created and sent');
            } catch (error) {
                console.error('[WebRTC Renderer] Error:', error);
                ipcRenderer.send('webrtc:error', error.message);
            }
        });

        // Handle answer from remote peer
        ipcRenderer.on('webrtc:answer', async (event, answer) => {
            console.log('[WebRTC Renderer] Received answer');

            if (peerConnection) {
                try {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
                    console.log('[WebRTC Renderer] Remote description set');
                } catch (error) {
                    console.error('[WebRTC Renderer] Error setting remote description:', error);
                    ipcRenderer.send('webrtc:error', error.message);
                }
            }
        });

        // Handle ICE candidate from remote peer
        ipcRenderer.on('webrtc:candidate', async (event, candidate) => {
            console.log('[WebRTC Renderer] Received ICE candidate');

            if (peerConnection) {
                try {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
                    console.log('[WebRTC Renderer] ICE candidate added');
                } catch (error) {
                    console.error('[WebRTC Renderer] Error adding ICE candidate:', error);
                    ipcRenderer.send('webrtc:error', error.message);
                }
            }
        });

        // Stop WebRTC
        ipcRenderer.on('webrtc:stop', () => {
            console.log('[WebRTC Renderer] Stopping...');

            if (dataChannel) {
                dataChannel.close();
                dataChannel = null;
            }

            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }

            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }

            console.log('[WebRTC Renderer] Stopped');
        });

        console.log('[WebRTC Renderer] Ready');
    </script>
</body>
</html>
