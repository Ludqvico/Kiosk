<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>WebRTC Capture</title>
</head>
<body>
    <script>
        const { ipcRenderer } = require('electron');

        let peerConnection = null;
        let dataChannel = null;
        let mediaStream = null;

        // WebRTC Configuration
        const config = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        // Start WebRTC capture
        ipcRenderer.on('webrtc:start', async (event, sourceId) => {
            console.log('[WebRTC Renderer] Starting with sourceId:', sourceId);

            try {
                // Get screen stream using desktopCapturer sourceId
                const constraints = {
                    audio: {
                        mandatory: {
                            chromeMediaSource: 'desktop',
                            chromeMediaSourceId: sourceId
                        }
                    },
                    video: {
                        mandatory: {
                            chromeMediaSource: 'desktop',
                            chromeMediaSourceId: sourceId,
                            minWidth: 1280,
                            maxWidth: 1920,
                            minHeight: 720,
                            maxHeight: 1080,
                            minFrameRate: 15,
                            maxFrameRate: 30
                        }
                    }
                };

                mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
                console.log('[WebRTC Renderer] Screen captured (with possible system audio)');

                // Try to capture microphone as well
                try {
                    const micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    micStream.getAudioTracks().forEach(track => {
                        mediaStream.addTrack(track);
                        console.log('[WebRTC Renderer] Microphone track added');
                    });
                } catch (micErr) {
                    console.warn('[WebRTC Renderer] Could not capture microphone:', micErr);
                }

                // Create PeerConnection
                peerConnection = new RTCPeerConnection(config);

                // ICE candidate event
                peerConnection.onicecandidate = (event) => {
                    if (event.candidate) {
                        ipcRenderer.send('webrtc:icecandidate', {
                            candidate: event.candidate.candidate,
                            sdpMLineIndex: event.candidate.sdpMLineIndex,
                            sdpMid: event.candidate.sdpMid
                        });
                    }
                };

                // Connection state
                peerConnection.onconnectionstatechange = () => {
                    console.log('[WebRTC Renderer] Connection state:', peerConnection.connectionState);
                    ipcRenderer.send('webrtc:connectionstate', peerConnection.connectionState);
                };

                // Create data channel for input
                dataChannel = peerConnection.createDataChannel('input');

                dataChannel.onopen = () => {
                    console.log('[WebRTC Renderer] ✓✓✓ Data channel OPENED');
                };

                dataChannel.onmessage = (event) => {
                    try {
                        const message = JSON.parse(event.data);
                        ipcRenderer.send('webrtc:input', message);
                    } catch (error) {
                        console.error('[WebRTC Renderer] Error parsing input:', error);
                    }
                };

                // Add all tracks to peer connection
                mediaStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, mediaStream);
                });

                // Create offer
                const offer = await peerConnection.createOffer({
                    offerToReceiveVideo: false,
                    offerToReceiveAudio: false
                });

                await peerConnection.setLocalDescription(offer);

                ipcRenderer.send('webrtc:offer', {
                    type: offer.type,
                    sdp: offer.sdp
                });

            } catch (error) {
                console.error('[WebRTC Renderer] Error:', error);
                ipcRenderer.send('webrtc:error', error.message);
            }
        });

        // Handle answer from remote peer
        ipcRenderer.on('webrtc:answer', async (event, answer) => {
            if (peerConnection) {
                try {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
                } catch (error) {
                    console.error('[WebRTC Renderer] Error setting remote description:', error);
                }
            }
        });

        // Handle ICE candidate
        ipcRenderer.on('webrtc:candidate', async (event, candidate) => {
            if (peerConnection) {
                try {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
                } catch (error) {
                    console.error('[WebRTC Renderer] Error adding ICE candidate:', error);
                }
            }
        });

        // Stop WebRTC
        ipcRenderer.on('webrtc:stop', () => {
            if (dataChannel) {
                dataChannel.close();
                dataChannel = null;
            }
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
        });

        console.log('[WebRTC Renderer] Ready');
    </script>
</body>
</html>
